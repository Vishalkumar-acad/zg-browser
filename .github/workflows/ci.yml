name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build & Source Syntax Validation
        run: npm run build

      - name: Run Automated Security Test Suite
        run: npm run test:security

      - name: Run Full Test Suite (Sequential Low-Memory Mode)
        run: npm test
